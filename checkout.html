<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>إكمال الاشتراك | COACH MAZEN</title>

<style>
html{visibility:hidden}
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
body{font-family:'Cairo',sans-serif;background:#080808;color:#fff;min-height:100vh;margin:0}
.glass{background:rgba(255,255,255,.03);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.1)}
</style>

<script>
(function(){
try{
var l=localStorage.getItem("userLang")||"ar";
document.documentElement.lang=l;
document.documentElement.dir=l==="ar"?"rtl":"ltr";
window.currentLang=l;
}catch(e){window.currentLang="ar"}
})();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
(function(){
var K=["contextmenu","selectstart","dragstart"];
K.forEach(function(E){
document.addEventListener(E,function(e){e.preventDefault()},false)
});
document.addEventListener("keydown",function(e){
var k=(e.key||"").toLowerCase();
if(
e.key==="F12"||
(e.ctrlKey||e.metaKey)&&["u","s","c","x","a"].indexOf(k)!==-1||
e.ctrlKey&&e.shiftKey&&["i","j","c"].indexOf(k)!==-1
){
e.preventDefault();
e.stopPropagation();
return false
}
},true)
})();
</script>
</head>

<body class="flex flex-col items-center min-h-screen">

<header class="w-full p-6 text-center border-b-2 border-yellow-500 bg-[#080808]">
<a href="index.html" class="block">
<div class="text-2xl font-black text-white tracking-tighter">
COACH <span class="text-yellow-500">MAZEN</span>
</div>
</a>
</header>

<main class="flex-grow flex items-center justify-center w-full p-4">

<div class="glass w-full max-w-2xl p-6 md:p-10 rounded-[2rem] shadow-2xl">

<div class="mb-8 text-center">
<h1 id="main-title"
class="text-2xl md:text-3xl font-black"
data-lang-ar="إكمال عملية الاشتراك"
data-lang-en="Complete Subscription">
إكمال عملية الاشتراك
</h1>

<p id="sub-title"
class="text-gray-400 text-sm mt-2"
data-lang-ar="اختر الباقة المناسبة وابدأ التحدي"
data-lang-en="Choose your plan and start the challenge">
اختر الباقة المناسبة وابدأ التحدي
</p>
</div>

<div
class="mb-6 p-4 rounded-xl border border-yellow-500/30 bg-yellow-500/5 text-center cursor-pointer hover:bg-yellow-500/10 transition"
onclick="window._cp('01014014202')">

<p
class="text-xs text-yellow-500 mb-1"
data-lang-ar="اضغط لنسخ رقم فودافون كاش"
data-lang-en="Click to copy Vodafone Cash number">
اضغط لنسخ رقم فودافون كاش
</p>

<div class="text-xl font-bold tracking-widest text-white">
01014014202
</div>
</div>

<form id="checkoutForm" class="grid grid-cols-1 md:grid-cols-2 gap-5">

<div class="md:col-span-2">
<label
class="text-xs text-gray-400 block mb-1"
data-lang-ar="الاسم الثلاثي"
data-lang-en="Full Name">
الاسم الثلاثي
</label>

<input
type="text"
required
class="w-full bg-black/50 p-4 rounded-xl border border-white/10 focus:border-yellow-500 outline-none transition">
</div>

<div class="md:col-span-2 relative group">

<label
class="text-xs text-gray-400 block mb-2"
data-lang-ar="الباقة المختارة"
data-lang-en="Selected Plan">
الباقة المختارة
</label>

<div
id="plan-dropdown"
class="w-full bg-black/50 border border-white/10 rounded-xl p-4 cursor-pointer flex justify-between items-center transition hover:border-yellow-500">

<span
id="selected-plan-text"
class="text-sm font-bold"
data-lang-ar="اختر باقتك..."
data-lang-en="Select your plan...">
اختر باقتك...
</span>

<svg class="w-4 h-4 transition-transform group-hover:rotate-180"
fill="none"
stroke="currentColor"
viewBox="0 0 24 24">
<path stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M19 9l-7 7-7-7">
</path>
</svg>
</div>

<div
id="dropdown-menu"
class="hidden absolute top-full mt-2 w-full bg-[#111] border border-white/10 rounded-xl overflow-hidden z-50 shadow-2xl">

<div class="p-2 space-y-1">

<div
class="text-[10px] text-yellow-500 font-bold px-3 py-1 uppercase tracking-widest"
data-lang-ar="3 أشهر"
data-lang-en="3 Months">
3 Months
</div>

<div
onclick="_p('silver_3',this)"
class="px-4 py-3 text-sm hover:bg-yellow-500 hover:text-black cursor-pointer rounded-lg transition"
data-ar="سيلفر (3 أشهر) - 2000 ج.م"
data-en="Silver (3 Months) - 2000 EGP">
Silver (3 Months) - 2000 EGP
</div>

<div
onclick="_p('gold_3',this)"
class="px-4 py-3 text-sm hover:bg-yellow-500 hover:text-black cursor-pointer rounded-lg transition border-l-4 border-yellow-500"
data-ar="جولد (3 أشهر) - 3000 ج.م"
data-en="Gold (3 Months) - 3000 EGP">
Gold (3 Months) - 3000 EGP
</div>

<div
class="text-[10px] text-yellow-500 font-bold px-3 py-1 uppercase tracking-widest mt-2"
data-lang-ar="6 أشهر"
data-lang-en="6 Months">
6 Months
</div>

<div
onclick="_p('silver_6',this)"
class="px-4 py-3 text-sm hover:bg-yellow-500 hover:text-black cursor-pointer rounded-lg transition"
data-ar="سيلفر (6 أشهر) - 5000 ج.م"
data-en="Silver (6 Months) - 5000 EGP">
Silver (6 Months) - 5000 EGP
</div>

<div
onclick="_p('gold_6',this)"
class="px-4 py-3 text-sm hover:bg-yellow-500 hover:text-black cursor-pointer rounded-lg transition"
data-ar="جولد (6 أشهر) - 6000 ج.م"
data-en="Gold (6 Months) - 6000 EGP">
Gold (6 Months) - 6000 EGP
</div>

</div>
</div>

<input
type="hidden"
id="selected-plan-value"
name="plan"
required>

</div>

<div class="md:col-span-2">

<label
class="text-xs text-gray-400 block mb-1"
data-lang-ar="إرفاق صورة الإيصال"
data-lang-en="Attach Receipt">
إرفاق صورة الإيصال
</label>

<input
type="file"
accept="image/*"
required
class="w-full bg-black/50 p-4 rounded-xl border border-white/10 text-gray-400 file:bg-yellow-500 file:text-black file:rounded-lg file:border-0 file:px-4 file:py-2">

</div>

<button
type="submit"
id="submit-btn"
class="md:col-span-2 w-full bg-yellow-500 hover:bg-yellow-400 text-black font-black py-4 rounded-xl transition mt-4"
data-lang-ar="تأكيد الاشتراك الآن"
data-lang-en="Confirm Subscription">
تأكيد الاشتراك الآن
</button>

</form>

<div class="mt-8 text-center">

<a
href="index.html"
id="back-btn"
class="text-gray-500 hover:text-white transition text-sm font-bold border-b border-gray-700"
data-lang-ar="← رجوع للرئيسية"
data-lang-en="← Back to Home">
← رجوع للرئيسية
</a>

</div>

</div>
</main>

<script>
(function(){

"use strict";

var _={
a:"https://api.imgbb.com/1/upload?key=0b57d93b71026863b36b92cfb36ee031",
b:"201014014202",
c:"01014014202"
};

var T={
ar:{
e:"خطأ",
r:"يرجى رفع صورة الإيصال",
u:"جاري رفع الصورة...",
s:"تم تحويلك للواتساب!",
m:"يرجى إرسال الرسالة لتأكيد الاشتراك.",
x:"حدث خطأ أثناء رفع الصورة",
o:"حسناً",
cop:"تم النسخ!"
},
en:{
e:"Error",
r:"Please upload the receipt image",
u:"Uploading image...",
s:"Redirected to WhatsApp!",
m:"Please send the message to confirm your subscription.",
x:"An error occurred while uploading the image",
o:"OK",
cop:"Copied!"
}
};

function L(){
return window.currentLang||"ar"
}

function V(){
document.querySelectorAll("[data-lang-"+L()+"]").forEach(function(e){
e.innerText=e.getAttribute("data-lang-"+L())
});
document.documentElement.lang=L();
document.documentElement.dir=L()==="ar"?"rtl":"ltr";
document.documentElement.style.visibility="visible"
}

window._cp=function(n){

if(navigator.clipboard){

navigator.clipboard.writeText(n).then(function(){

Swal.fire({
icon:"success",
title:T[L()].cop,
text:n,
timer:1500,
showConfirmButton:false,
background:"#111",
color:"#fff"
});

}).catch(function(){

var x=document.createElement("textarea");
x.value=n;
document.body.appendChild(x);
x.select();
document.execCommand("copy");
x.remove();

});
}

};

window._p=function(v,e){

var q=L()==="ar"?e.getAttribute("data-ar"):e.getAttribute("data-en");

document.getElementById("selected-plan-value").value=v;
document.getElementById("selected-plan-text").innerText=q;
document.getElementById("dropdown-menu").classList.add("hidden");

};

var D=document.getElementById("plan-dropdown");
var M=document.getElementById("dropdown-menu");

D.addEventListener("click",function(){
M.classList.toggle("hidden")
});

window.addEventListener("click",function(e){
if(!D.contains(e.target)){
M.classList.add("hidden")
}
});

var F=document.getElementById("checkoutForm");

F.addEventListener("submit",async function(e){

e.preventDefault();

var l=L();

var name=F.querySelector('input[type="text"]').value.trim();

var plan=document.getElementById("selected-plan-text").innerText;

var value=document.getElementById("selected-plan-value").value;

var fi=F.querySelector('input[type="file"]');

var file=fi.files[0];

if(!value){

Swal.fire({
title:T[l].e,
text:l==="ar"?"يرجى اختيار الباقة":"Please select a plan",
icon:"error",
background:"#111",
color:"#fff"
});

return
}

if(!file){

Swal.fire(
T[l].e,
T[l].r,
"error"
);

return
}

if(!file.type.startsWith("image/")){

Swal.fire({
title:T[l].e,
text:l==="ar"?"يرجى اختيار صورة صحيحة":"Please select a valid image",
icon:"error",
background:"#111",
color:"#fff"
});

return
}

Swal.fire({
title:T[l].u,
allowOutsideClick:false,
background:"#111",
color:"#fff",
didOpen:function(){
Swal.showLoading()
}
});

try{

var fd=new FormData();

fd.append("image",file);

var response=await fetch(_,{
method:"POST",
body:fd
});

if(!response.ok)
throw new Error("HTTP Error");

var data=await response.json();

if(!data.success)
throw new Error("Upload failed");

var url=data.data.url;

var msg=
"كوتش مازن\n"+
"عايز أشترك \n\n"+
"الاسم: "+name+"\n"+
"الباقة: "+plan+"\n\n"+
"رابط إيصال الدفع:\n"+
url;

var wa="https://wa.me/"+_.b+"?text="+encodeURIComponent(msg);

window.open(wa,"_blank");

Swal.fire({
title:T[l].s,
text:T[l].m,
icon:"success",
background:"#111",
color:"#fff",
confirmButtonColor:"#eab308",
confirmButtonText:T[l].o
});

}catch(err){

console.error(err);

Swal.fire({
title:T[l].e,
text:T[l].x,
icon:"error",
background:"#111",
color:"#fff",
confirmButtonColor:"#eab308"
});

}

});

V();

})();
</script>

</body>
</html>
